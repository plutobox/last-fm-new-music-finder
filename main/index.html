<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Song finder</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet" />
    <style>
      :root {
        --paper: #f6e8ef;
        --panel: #fff6fa;
        --ink: #17134f;
        --soft: #57528c;
        --line: #d8c5e0;
        --blue: #2b2bd6;
        --on-blue: #ffffff;
        --gold: #ffb400;
        --bar: #ffd566;
        color-scheme: light;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --paper: #14123f;
          --panel: #1d1a55;
          --ink: #f6e8ef;
          --soft: #b9b4e4;
          --line: #3b3785;
          --blue: #a9a9ff;
          --on-blue: #14123f;
          --gold: #ffb400;
          --bar: #5a4a12;
          color-scheme: dark;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font: 400 1rem/1.5 "Atkinson Hyperlegible", system-ui, sans-serif;
      }
      button, input, select { font: inherit; color: inherit; }
      a { color: var(--blue); }
      :focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
      .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }

      .page { max-width: 88rem; margin: 0 auto; padding: 2.5rem 1rem 3rem; }
      @media (min-width: 40rem) { .page { padding-inline: 2rem; } }

      h1 {
        margin: 0;
        font: 800 clamp(3rem, 11vw, 7.5rem)/0.92 "Bricolage Grotesque", system-ui, sans-serif;
        letter-spacing: -0.03em;
        color: var(--blue);
      }
      .intro { max-width: 62ch; margin: 1rem 0 0; font-size: 1.125rem; }
      .status p { max-width: 62ch; }

      .finder { display: grid; gap: 2rem; grid-template-columns: minmax(0, 1fr); }
      .finder > header, .finder > footer { grid-column: 1 / -1; }
      .finder > footer { color: var(--soft); font-size: 0.875rem; }
      @media (min-width: 62rem) {
        .finder { grid-template-columns: 22rem minmax(0, 1fr); align-items: start; }
      }

      .filters { display: grid; gap: 1.25rem; }
      fieldset { border: 0; margin: 0; padding: 0; min-width: 0; }
      legend, .field-name { display: block; padding: 0; font-weight: 700; margin-bottom: 0.25rem; }
      .field { display: block; }
      input, select {
        width: 100%;
        min-height: 2.75rem;
        padding: 0.5rem 0.75rem;
        background: var(--panel);
        border: 2px solid var(--line);
        border-radius: 0.375rem;
      }
      input::placeholder { color: var(--soft); opacity: 1; }
      .range { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; }
      .range .field-name { grid-column: 1 / -1; margin-bottom: 0; }

      .genre-match { display: inline-flex; margin-bottom: 0.625rem; }
      .toggle {
        min-height: 2.25rem;
        padding: 0.25rem 0.75rem;
        background: transparent;
        border: 2px solid var(--blue);
        cursor: pointer;
      }
      .toggle:first-child { border-radius: 0.375rem 0 0 0.375rem; border-right-width: 0; }
      .toggle:last-child { border-radius: 0 0.375rem 0.375rem 0; }
      .toggle.is-on { background: var(--blue); color: var(--on-blue); }

      /* Bin dividers from a record shop: the one loud element on the page. */
      .genres { display: flex; flex-wrap: wrap; gap: 0.375rem; max-height: 22rem; overflow-y: auto; padding: 3px; }
      .genre {
        display: inline-flex;
        align-items: baseline;
        gap: 0.375rem;
        min-height: 2.25rem;
        padding: 0.25rem 0.625rem;
        font-family: "Bricolage Grotesque", system-ui, sans-serif;
        font-weight: 500;
        background: var(--panel);
        border: 2px solid var(--line);
        border-radius: 0.625rem 0.625rem 0.125rem 0.125rem;
        cursor: pointer;
      }
      .genre:hover { border-color: var(--blue); }
      .genre-count { font-size: 0.75rem; color: var(--soft); }
      .genre.is-on { background: var(--gold); border-color: var(--gold); color: #17134f; }
      .genre.is-on .genre-count { color: #17134f; }
      .genre.is-out { border-style: dashed; border-color: var(--soft); color: var(--soft); text-decoration: line-through; }
      .genre.is-out:hover { border-color: var(--blue); }
      .hint { margin: 0 0 0.625rem; color: var(--soft); font-size: 0.875rem; }

      .reset, .action {
        justify-self: start;
        min-height: 2.75rem;
        padding: 0.5rem 1rem;
        font-weight: 700;
        border-radius: 0.375rem;
        cursor: pointer;
      }
      .reset { background: transparent; border: 2px solid var(--line); }
      .reset:hover { border-color: var(--blue); }
      .action { background: var(--blue); color: var(--on-blue); border: 2px solid var(--blue); }

      .controls { display: flex; flex-wrap: wrap; align-items: end; gap: 0.75rem; margin-bottom: 1rem; }
      .controls .field { flex: 1 1 11rem; max-width: 16rem; }
      .summary { margin: 0 0 0.75rem; color: var(--soft); }
      .empty { padding: 2rem 0; }
      .empty p { margin-top: 0; }

      table { width: 100%; border-collapse: collapse; }
      th { text-align: left; font-weight: 700; padding: 0.5rem 0.75rem; border-bottom: 3px solid var(--ink); }
      td { padding: 0.75rem; border-bottom: 1px solid var(--line); vertical-align: top; }
      .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
      .pos { width: 3rem; padding-left: 0; color: var(--soft); text-align: right; font-variant-numeric: tabular-nums; }
      .track { position: relative; min-width: 0; overflow-wrap: anywhere; }
      /* Listeners, as a share of the most-heard song. */
      .bar { height: 0.375rem; margin-bottom: 0.375rem; background: var(--bar); border-radius: 0 0.25rem 0.25rem 0; }
      .title {
        font: 500 1.25rem/1.2 "Bricolage Grotesque", system-ui, sans-serif;
        text-decoration: none;
      }
      .title:hover { text-decoration: underline; }
      .artist { font-weight: 700; }
      .tags { color: var(--soft); font-size: 0.875rem; }

      .check { display: flex; align-items: center; gap: 0.5rem; font-weight: 700; cursor: pointer; }
      .check input { width: 1.25rem; min-height: 1.25rem; margin: 0; accent-color: var(--blue); }

      .play {
        display: inline-grid;
        place-items: center;
        width: 2.25rem;
        height: 2.25rem;
        margin-top: 0.25rem;
        color: var(--on-blue);
        background: var(--blue);
        border: 2px solid var(--blue);
        border-radius: 50%;
        text-decoration: none;
        cursor: pointer;
      }
      .play-away { color: var(--blue); background: transparent; border-color: var(--line); }
      .play-away:hover { border-color: var(--blue); }
      tr.is-playing .title { text-decoration: underline; text-decoration-color: var(--gold); text-decoration-thickness: 3px; }

      /* Room for the bar, so it never covers the last rows. */
      .finder { padding-bottom: 6rem; }

      .player { display: none; }
      .player.is-open { display: block; }
      .player-video {
        position: fixed;
        z-index: 2;
        right: 1rem;
        bottom: 5.5rem;
        width: min(480px, calc(100vw - 2rem));
        aspect-ratio: 16 / 9;
        background: #000;
        border-radius: 0.375rem;
        overflow: hidden;
      }
      /* YouTube's minimum player size. */
      .player-video.is-small { width: 200px; height: 200px; aspect-ratio: auto; }
      .player-video iframe, .player-video > div { display: block; width: 100%; height: 100%; border: 0; }
      .player-bar {
        position: fixed;
        z-index: 3;
        left: 0;
        right: 0;
        bottom: 0;
        display: grid;
        grid-template-columns: auto minmax(0, 1fr) auto;
        align-items: center;
        gap: 0.25rem 1.5rem;
        padding: 0 1rem 0.5rem;
        background: var(--panel);
        border-top: 2px solid var(--line);
      }
      .player-seek {
        grid-column: 1 / -1;
        width: 100%;
        min-height: 1rem;
        margin: 0;
        padding: 0;
        border: 0;
        background: transparent;
        accent-color: var(--blue);
        cursor: pointer;
      }
      .player-controls, .player-extras { display: flex; align-items: center; gap: 0.5rem; }
      .player-icon, .player-main, .player-text { background: transparent; border: 0; cursor: pointer; border-radius: 0.375rem; }
      .player-icon { width: 2.5rem; height: 2.5rem; font-size: 1.125rem; }
      .player-main {
        width: 3rem;
        height: 3rem;
        font-size: 1.25rem;
        color: var(--on-blue);
        background: var(--blue);
        border-radius: 50%;
      }
      .player-text { min-height: 2.5rem; padding: 0 0.5rem; font-size: 0.875rem; }
      .player-icon:hover, .player-text:hover { background: var(--line); }
      .player-time { color: var(--soft); font-size: 0.875rem; font-variant-numeric: tabular-nums; white-space: nowrap; }
      .player-song { min-width: 0; }
      .player-title {
        font: 500 1.125rem/1.2 "Bricolage Grotesque", system-ui, sans-serif;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .player-artist, .player-problem { font-size: 0.875rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .player-artist { color: var(--soft); }
      .player-volume { width: 6rem; min-height: 1rem; padding: 0; border: 0; background: transparent; accent-color: var(--blue); }

      @media (max-width: 52rem) {
        .finder { padding-bottom: 9rem; }
        .player-bar { grid-template-columns: minmax(0, 1fr) auto; }
        .player-song { grid-column: 1 / -1; grid-row: 2; }
        .player-controls { grid-row: 3; }
        .player-extras { grid-row: 3; }
        .player-volume { display: none; }
        .player-video { bottom: 8.75rem; }
      }

      @media (max-width: 40rem) {
        thead { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
        table, tbody { display: block; }
        tr {
          display: grid;
          grid-template-columns: 2.25rem repeat(3, minmax(0, 1fr));
          padding: 0.75rem 0;
          border-bottom: 1px solid var(--line);
        }
        td { display: block; padding: 0; border: 0; }
        .pos { width: auto; grid-row: 1; text-align: left; padding-top: 0.625rem; }
        .track { grid-column: 2 / -1; grid-row: 1; margin-bottom: 0.5rem; }
        .num { text-align: left; white-space: normal; }
        .num:nth-child(3) { grid-column: 2; }
        .num::before { content: attr(data-label); display: block; font-size: 0.75rem; color: var(--soft); }
        .controls .field { max-width: none; }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <!-- relative path so it works under /last-fm-new-music-finder/<branch>/ -->
    <!-- CI replaces 2b53746f21c96e204cee0aced3f8567becd6fb15, so a browser can't pair a new page with a cached older script -->
    <script src="./main.js?v=2b53746f21c96e204cee0aced3f8567becd6fb15"></script>
  </body>
</html>
