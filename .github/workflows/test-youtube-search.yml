name: Test YouTube search

# Checks whether yt-dlp can search YouTube from a GitHub runner. Metadata only, and it saves nothing.
on:
  workflow_dispatch:
    inputs:
      count:
        description: "How many songs to look up"
        default: "200"
      workers:
        description: "How many batches to run at once"
        default: "4"

permissions:
  contents: read

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install yt-dlp, checking its published checksum
        shell: bash
        run: |
          version=2026.10.26
          base="https://github.com/yt-dlp/yt-dlp/releases/download/$version"
          curl -fsSL -o yt-dlp_linux "$base/yt-dlp_linux"
          curl -fsSL -o SHA2-256SUMS "$base/SHA2-256SUMS"
          grep -E ' yt-dlp_linux$' SHA2-256SUMS | sha256sum -c -
          chmod +x yt-dlp_linux
          ./yt-dlp_linux --version

      - name: Search for songs with no video
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          COUNT: ${{ inputs.count }}
          WORKERS: ${{ inputs.workers }}
        run: node scripts/test-youtube-search.mjs --count "$COUNT" --workers "$WORKERS" --yt-dlp ./yt-dlp_linux
