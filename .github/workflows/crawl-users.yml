name: Crawl Last.fm users

on:
  schedule:
    - cron: "12 3 * * *" # daily, in the gap after the 01:47 fetch
  workflow_dispatch:
    inputs:
      seeds:
        description: "Comma-separated seed usernames (leave empty to pick random users from the existing list)"
        default: ""
      random_seeds:
        description: "How many random seeds to pick when seeds is empty"
        default: "5"
      depth:
        description: "Friend-hops from the seeds"
        default: "2"
      max_users:
        description: "Stop after this many users not already in the list"
        default: "5000"

permissions:
  contents: write

concurrency:
  group: database-write
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      LAST_FM_RATE_LIMIT_FILE: rate-limit-hit # lets one step's rate-limit stop reach the later steps
    steps:
      - uses: actions/checkout@v7
        with:
          path: feature

      - uses: actions/setup-node@v7
        with:
          node-version: 24 # built-in node:sqlite

      - name: Install script dependencies
        working-directory: feature/scripts
        run: npm ci

      - name: Download the database from the release
        run: node feature/scripts/release-store.mjs download db

      - name: Crawl friends (decrypts, updates, re-encrypts)
        env:
          LAST_FM_API_KEY: ${{ secrets.LAST_FM_API_KEY }}
          LAST_FM_AGE_IDENTITY: ${{ secrets.LAST_FM_AGE_IDENTITY }}
          LAST_FM_APPLICATION_NAME: ${{ vars.LAST_FM_APPLICATION_NAME }}
          # Scheduled runs have no inputs, so fall back to the defaults.
          SEEDS: ${{ inputs.seeds || '' }}
          RANDOM_SEEDS: ${{ inputs.random_seeds || '5' }}
          DEPTH: ${{ inputs.depth || '2' }}
          MAX_USERS: ${{ inputs.max_users || '5000' }}
        run: |
          node feature/scripts/crawl-friends.mjs \
            --seeds "$SEEDS" \
            --random-seeds "$RANDOM_SEEDS" \
            --depth "$DEPTH" \
            --max-users "$MAX_USERS" \
            --db db/users.db.age

      - name: Upload the database to the release
        run: node feature/scripts/release-store.mjs upload db

      # After the upload, so progress is kept. A red run makes a rate-limit stop hard to miss.
      - name: Fail the run if Last.fm rate limited us
        run: |
          if [ -f rate-limit-hit ]; then
            echo "::error::Last.fm rate limited this run, so it stopped sending requests. Check before running again."
            exit 1
          fi
