name: Crawl Last.fm users

on:
  schedule:
    - cron: "17 */2 * * *" # every 2 hours (off the top of the hour, which GitHub delays most)
  workflow_dispatch:
    inputs:
      seeds:
        description: "Comma-separated seed usernames (leave empty to pick random users from the existing list)"
        default: ""
      random_seeds:
        description: "How many random seeds to pick when seeds is empty"
        default: "5"
      depth:
        description: "Friend-hops from the seeds"
        default: "2"
      max_users:
        description: "Stop after this many users not already in the list"
        default: "500"

permissions:
  contents: write

concurrency:
  group: gh-pages-write
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: feature

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Checkout gh-pages branch (create if missing)
        shell: bash
        run: |
          if git ls-remote --exit-code --heads "https://github.com/${{ github.repository }}.git" gh-pages >/dev/null 2>&1; then
            git clone --branch gh-pages --depth 1 "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" pages
          else
            git init pages
            git -C pages checkout --orphan gh-pages
            git -C pages remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          fi

      - name: Install script dependencies
        working-directory: feature/scripts
        run: npm ci

      - name: Crawl friends (decrypts, merges, re-encrypts data/users.json.age)
        env:
          LAST_FM_API_KEY: ${{ secrets.LAST_FM_API_KEY }}
          LAST_FM_AGE_IDENTITY: ${{ secrets.LAST_FM_AGE_IDENTITY }}
          LAST_FM_APPLICATION_NAME: ${{ vars.LAST_FM_APPLICATION_NAME }}
          # Scheduled runs have no inputs, so fall back to the defaults.
          SEEDS: ${{ inputs.seeds || '' }}
          RANDOM_SEEDS: ${{ inputs.random_seeds || '5' }}
          DEPTH: ${{ inputs.depth || '2' }}
          MAX_USERS: ${{ inputs.max_users || '500' }}
        run: |
          node feature/scripts/crawl-friends.mjs \
            --seeds "$SEEDS" \
            --random-seeds "$RANDOM_SEEDS" \
            --depth "$DEPTH" \
            --max-users "$MAX_USERS" \
            --out pages/data/users.json.age

      - name: Commit users.json to gh-pages
        uses: EndBug/add-and-commit@v9
        with:
          cwd: pages
          message: "Update encrypted crawled users"
          push: origin gh-pages --set-upstream
