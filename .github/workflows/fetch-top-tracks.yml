name: Fetch top songs

on:
  schedule:
    - cron: "47 * * * *" # every hour (off the top of the hour, which GitHub delays most)
  workflow_dispatch:
    inputs:
      max_users:
        description: "Stop after this many users"
        default: "5000"
      minutes:
        description: "Stop fetching after this many minutes, keeping progress"
        default: "40"

permissions:
  contents: write

concurrency:
  group: database-write
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 75 # 40 of fetching, plus moving a database that can reach hundreds of MB
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: feature

      - uses: actions/setup-node@v4
        with:
          node-version: 24 # built-in node:sqlite

      - name: Install script dependencies
        working-directory: feature/scripts
        run: npm ci

      - name: Download the database from the release
        run: node feature/scripts/release-store.mjs download db

      - name: Fetch top and loved songs (decrypts, updates, re-encrypts)
        env:
          LAST_FM_API_KEY: ${{ secrets.LAST_FM_API_KEY }}
          LAST_FM_AGE_IDENTITY: ${{ secrets.LAST_FM_AGE_IDENTITY }}
          LAST_FM_USERNAME: ${{ secrets.LAST_FM_USERNAME }}
          LAST_FM_APPLICATION_NAME: ${{ vars.LAST_FM_APPLICATION_NAME }}
          # Scheduled runs have no inputs, so fall back to the defaults.
          MAX_USERS: ${{ inputs.max_users || '5000' }}
          MINUTES: ${{ inputs.minutes || '40' }}
        run: |
          node feature/scripts/fetch-top-tracks.mjs \
            --db db/users.db.age \
            --max-users "$MAX_USERS" \
            --minutes "$MINUTES"

      - name: Upload the database to the release
        run: node feature/scripts/release-store.mjs upload db
